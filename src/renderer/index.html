<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self' 'unsafe-inline' data: blob:; connect-src 'self' ws: wss: http: https:; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; font-src 'self' data:;" />
  <title>DgodTerm</title>
</head>
<body class="bg-[#090d16] text-slate-100 font-sans select-none overflow-hidden h-screen w-screen m-0 p-0">
  <div id="root" class="h-full w-full">
    <!-- Instant Native Splash: renders at t=0ms so screen is never blank -->
    <div style="height:100vh;width:100vw;display:flex;align-items:center;justify-content:center;background:#090d16;color:#f8fafc;font-family:system-ui,-apple-system,sans-serif;">
      <div style="width:100%;max-width:448px;margin:16px;padding:32px;background:#0c1220;border:1px solid #1e293b;border-radius:16px;box-shadow:0 25px 50px -12px rgba(0,0,0,0.6);display:flex;flex-direction:column;gap:24px;position:relative;overflow:hidden;">
        <div style="text-align:center;display:flex;flex-direction:column;align-items:center;gap:8px;">
          <div style="width:52px;height:52px;border-radius:16px;background:rgba(14,165,233,0.1);border:1px solid rgba(14,165,233,0.25);display:flex;align-items:center;justify-content:center;color:#38bdf8;">
            <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
          </div>
          <h2 style="font-size:20px;font-weight:700;color:#ffffff;margin:4px 0 0 0;letter-spacing:-0.02em;">DgodTerm Workstation</h2>
          <p style="font-size:12px;color:#94a3b8;margin:0;">Enterprise Linux Fleet & SSH Workstation Authentication</p>
        </div>
        <div style="display:flex;flex-direction:column;gap:16px;">
          <div>
            <div style="display:flex;justify-content:space-between;margin-bottom:6px;">
              <span style="font-size:12px;font-weight:600;color:#cbd5e1;">Workstation Password</span>
            </div>
            <div style="width:100%;box-sizing:border-box;background:#030712;border:1px solid #334155;border-radius:12px;padding:10px 14px;color:#64748b;font-size:12px;">
              Enter master password...
            </div>
          </div>
          <div style="width:100%;box-sizing:border-box;padding:10px 16px;border-radius:12px;background:#0284c7;color:#ffffff;font-size:12px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:8px;box-shadow:0 10px 15px -3px rgba(2,132,199,0.3);">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><path d="m9 12 2 2 4-4"/></svg>
            Unlock & Sign In
          </div>
        </div>
      </div>
    </div>
  </div>
  <script type="module" src="./main.tsx"></script>
</body>
</html>
