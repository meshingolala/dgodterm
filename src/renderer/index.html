<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self' 'unsafe-inline' data: blob:; connect-src 'self' ws: wss: http: https:; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com;" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@300;400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600;700&family=Inconsolata:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@300;400;500;600;700&family=Outfit:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Roboto+Mono:wght@400;500;600;700&family=Source+Code+Pro:wght@400;500;600;700&family=Space+Mono:wght@400;700&family=Ubuntu+Mono:wght@400;700&display=swap" rel="stylesheet">
  <title>DgodTerm</title>
  <link rel="icon" type="image/png" href="./assets/icon-64.png" />
</head>
<body class="bg-[#090d16] text-slate-100 font-sans overflow-hidden h-screen w-screen m-0 p-0">
  <div id="root" class="h-full w-full">
    <!-- Clean native initialization loader: renders instantly until React mounts -->
    <div style="height:100vh;width:100vw;display:flex;align-items:center;justify-content:center;background:#090d16;color:#94a3b8;font-family:system-ui,-apple-system,sans-serif;">
      <div style="display:flex;flex-direction:column;align-items:center;gap:12px;">
        <div style="width:36px;height:36px;border:3px solid #0284c7;border-top-color:transparent;border-radius:50%;animation:dgodterm-spin 1s linear infinite;"></div>
        <div style="font-size:12px;color:#64748b;letter-spacing:0.05em;font-family:monospace;">INITIALIZING DGODTERM...</div>
      </div>
      <style>
        @keyframes dgodterm-spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
      </style>
    </div>
  </div>
  <script type="module" src="./main.tsx"></script>
</body>
</html>
